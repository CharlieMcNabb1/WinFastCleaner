# Built-in cleaning rules: web browser caches.
# Only caches are cleaned here. History, cookies, passwords, and other
# personal browser data are never touched by these rules.
# Format: docs/rule-format.md. Written from scratch for WinFastCleaner.

[[rule]]
id = "chrome.cache"
name = "Google Chrome cache"
group = "Google Chrome"
tier = "green"
description = "Copies of web pages, images, and scripts Chrome keeps to load sites faster."
lose = "Nothing. Sites may load a little slower the first time. You stay signed in."
paths = [
    '%LOCALAPPDATA%\Google\Chrome\User Data\*\Cache',
    '%LOCALAPPDATA%\Google\Chrome\User Data\*\Code Cache',
    '%LOCALAPPDATA%\Google\Chrome\User Data\*\GPUCache',
    '%LOCALAPPDATA%\Google\Chrome\User Data\ShaderCache',
    '%LOCALAPPDATA%\Google\Chrome\User Data\GrShaderCache',
]
close_apps = ["chrome.exe"]

