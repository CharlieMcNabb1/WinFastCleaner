paths = [
    '%XDG_CONFIG_HOME%/discord/Cache',
    '%XDG_CONFIG_HOME%/discord/Code Cache',
    '%XDG_CONFIG_HOME%/discord/GPUCache',
]
close_apps = ["discord"]

[[rule]]
id = "vscode.cache"
name = "Visual Studio Code cache"
group = "Apps"
tier = "green"
description = "Web content, compiled code, and downloaded extension packages cached by VS Code."
lose = "Nothing. VS Code may start a little slower once. Your settings and extensions stay."
paths = [
    '%XDG_CONFIG_HOME%/Code/Cache',
    '%XDG_CONFIG_HOME%/Code/CachedData',
    '%XDG_CONFIG_HOME%/Code/Code Cache',
    '%XDG_CONFIG_HOME%/Code/GPUCache',
    '%XDG_CONFIG_HOME%/Code/CachedExtensionVSIXs',
]
close_apps = ["code"]

[[rule]]
id = "steam.web-cache"
name = "Steam web cache"
group = "Apps"
tier = "green"
description = "Store and community pages cached by the Steam client."
lose = "Nothing. Steam loads the pages again. Your games are not affected."
paths = ['%HOME%/.local/share/Steam/config/htmlcache']
close_apps = ["steam", "steamwebhelper"]

[[rule]]
id = "spotify.cache"
name = "Spotify cache"
group = "Apps"
tier = "yellow"
description = "Songs and podcasts Spotify saved to play them faster."
lose = "Spotify streams them again, which uses data. Songs you downloaded for offline listening may need downloading again."
paths = ['%XDG_CACHE_HOME%/spotify/Data', '%XDG_CACHE_HOME%/spotify/Storage']
close_apps = ["spotify"]

