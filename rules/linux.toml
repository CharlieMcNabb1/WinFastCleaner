# Built-in cleaning rules: Linux.
# Rules that clean the same app as a Windows rule share its id, so a
# schedule keeps meaning the same thing on both systems.
# Format: docs/rule-format.md. Written from scratch for WinFastCleaner.

[[rule]]
id = "linux.temp"
name = "Temporary files"
group = "System"
tier = "green"
description = "Files that programs leave in the temporary folder while installing, updating, or running."
lose = "Nothing. Programs recreate temporary files when they need them. Files from the last 7 days and other accounts' files are kept."
paths = ['%TEMP%']
min_age_days = 7

[[rule]]
id = "linux.thumbnails"
name = "Thumbnail cache"
group = "System"
tier = "green"
description = "Small preview images file managers save for pictures and videos."
lose = "Nothing. Thumbnails are made again as you browse."
paths = ['%XDG_CACHE_HOME%/thumbnails']
remove_empty_folders = false

[[rule]]
id = "chrome.cache"
name = "Google Chrome cache"
group = "Google Chrome"
tier = "green"
description = "Copies of web pages, images, and scripts Chrome keeps to load sites faster."
lose = "Nothing. Sites may load a little slower the first time. You stay signed in."
paths = [
    '%XDG_CACHE_HOME%/google-chrome/*/Cache',
    '%XDG_CACHE_HOME%/google-chrome/*/Code Cache',
    '%XDG_CONFIG_HOME%/google-chrome/*/GPUCache',
    '%XDG_CONFIG_HOME%/google-chrome/ShaderCache',
    '%XDG_CONFIG_HOME%/google-chrome/GrShaderCache',
]
close_apps = ["chrome"]

