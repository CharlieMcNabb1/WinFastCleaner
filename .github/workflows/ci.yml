name: CI

# Pull requests get a full run against the merged result; pushes to main
# re-check after merging. (Branch pushes are covered by their PR, so nothing
# runs twice.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the code. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: windows-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Type-check frontend
        working-directory: app
        run: npm run check

      - name: Test frontend
        working-directory: app
        run: npm test

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        # Report every failing test, not just the first failing binary.
        run: cargo test --workspace --locked --no-fail-fast

  installer:
    name: Installer installs and uninstalls cleanly (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: windows-release-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: windows-release-cargo-

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Build the installer
        shell: pwsh
        run: scripts/build-installer.ps1

      - name: Test install and uninstall
        shell: pwsh
        run: scripts/test-installer.ps1 (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName

  linux-core:
    name: Core tests incl. NTFS image (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install NTFS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ntfs-3g

      - name: clippy (core, cli, tray)
        run: cargo clippy -p cleaner-core -p cleaner-cli -p cleaner-tray --all-targets --locked -- -D warnings

      - name: Build a synthetic NTFS test image
        run: sudo scripts/ntfs-test-image.sh setup "$RUNNER_TEMP/ntfs"

      - name: Test (core + cli, including MFT parser against the NTFS image)
        env:
          WFC_NTFS_TEST_IMAGE: ${{ runner.temp }}/ntfs/test.img
          WFC_NTFS_TEST_MOUNT: ${{ runner.temp }}/ntfs/mnt
        run: cargo test -p cleaner-core -p cleaner-cli --locked --no-fail-fast

      - name: Tear down NTFS test image
        if: always()
        run: sudo scripts/ntfs-test-image.sh teardown "$RUNNER_TEMP/ntfs"

  linux-packages:
    name: Linux packages build, install, and uninstall
    # The oldest supported runner, so the AppImage runs on older distros too.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-release-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: linux-release-cargo-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev patchelf file xdg-utils

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: clippy (desktop app on Linux)
        run: cargo clippy -p cleaner-app --all-targets --locked -- -D warnings

      - name: Build the AppImage and .deb
        run: scripts/build-linux.sh

      - name: Test install and uninstall (.deb)
        run: |
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          test -x /usr/bin/winfastcleaner
          wfc --version
          sudo apt-get remove -y win-fast-cleaner
          test ! -e /usr/bin/winfastcleaner
