# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`. CI runs it on every push and weekly.

[graph]
# The app ships for Windows x64. Linux is included because core/cli tests
# run there too.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Known vulnerabilities in any crate always fail the check (the default).
# Unmaintained-crate notices only fail for our own direct dependencies; deep
# transitive ones (mostly via Tauri) are tracked through Dependabot.
unmaintained = "workspace"
yanked = "deny"
ignore = [
]

[licenses]
# The project is MIT. Only permissive licenses that are compatible with
# distributing an MIT-licensed binary are allowed.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # File-level weak copyleft. It is compatible with an MIT app as long as
    # those files stay under MPL. Used by a few Tauri HTML/CSS crates
    # (cssparser, selectors).
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = [
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Workspace crates refer to each other by path.
allow-wildcard-paths = true
deny = [
    # The app must not make network requests (see SECURITY.md). Block the
    # common HTTP/TLS client stacks from sneaking in as dependencies.
    { crate = "reqwest", reason = "the app makes no network requests" },
    { crate = "ureq", reason = "the app makes no network requests" },
    { crate = "hyper", reason = "the app makes no network requests" },
    { crate = "native-tls", reason = "the app makes no network requests" },
    { crate = "rustls", reason = "the app makes no network requests" },
]
skip = [
]
skip-tree = [
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
